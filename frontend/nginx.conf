server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Komprese textových souborů → menší přenos dat (Lighthouse + sustainability)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → backend kontejner (služba "api" v docker-compose, port 8080)
    location /api/ {
        # Docker DNS: adresa "api" se zjistí až při requestu,
        # takže nginx naběhne, i když backend ještě neběží
        resolver 127.0.0.11 valid=10s;
        set $backend http://api:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Soubory z Vite mají v názvu hash (index-B2Wz2jzV.js) → můžou se cachovat navždy
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: všechno ostatní → index.html, cestu vyřeší React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}